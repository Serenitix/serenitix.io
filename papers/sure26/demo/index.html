<!--
Abstraction: Terminal replay of the AuthDiff demo for presenting in a browser.
Mechanism: Recorded run-demo.sh sessions embedded as data; Enter/Space/→ advances (type command, then print output); ← goes back; 1–4 jump to a case.
Policy: Recorded output only (DUC v2 prototype, recorded 2026-11-18/19); labelled as such on screen. Offline, no external assets.
Scope: Self demo/index.html (generated by demo/build-replay.py from demo/recorded/case1-4.txt).
Contract: Every output line shown equals a line of the recorded file.
-->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthDiff demo · Changes in the Guard</title>
<style>
:root { --bg:#0d1417; --fg:#d9e3e6; --dim:#7f9196; --teal:#5fd1bd; --amber:#f2b866; --red:#ff7b72; --green:#7ee787; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
body { font: 22px/1.45 Menlo, "SF Mono", Consolas, monospace; display:flex; flex-direction:column; }
header { padding:14px 28px; border-bottom:1px solid #22313a; display:flex; justify-content:space-between; align-items:baseline; font-family: -apple-system, Helvetica, Arial, sans-serif; }
header .t { font-weight:700; font-size:20px; }
header .h { color:var(--dim); font-size:15px; }
#term { flex:1; overflow-y:auto; padding:22px 28px 60px; white-space:pre; }
.title { color:#fff; font-weight:700; } .sub { color:var(--dim); }
.q { color:#fff; font-weight:700; margin-top:14px; }
.prompt { color:var(--teal); } .cmd { color:#fff; }
.del { color:var(--red); } .add { color:var(--green); }
.guard { color:var(--teal); font-weight:700; }
.new { color:var(--amber); font-weight:700; } .tru { color:var(--amber); }
.cursor { display:inline-block; width:0.6em; background:var(--fg); animation:b 1s steps(1) infinite; }
@keyframes b { 50% { opacity:0; } }
footer { padding:8px 28px; color:var(--dim); font: 14px -apple-system, Helvetica, Arial, sans-serif; border-top:1px solid #22313a; }
</style></head>
<body>
<header><span class="t">AuthDiff · differential guarded flow paths</span><span class="h">Enter: next · ←: back · 1–4: case · recorded output, DUC v2 prototype</span></header>
<div id="term"></div>
<footer>Changes in the Guard · SURE ’26 · serenitix.io/papers/sure26 · replay of recorded <code>duc-proto</code> runs on the paper’s fixtures (lift + diff; no checker evaluated)</footer>
<script>
const CASES = [{"title": "1 · Document fetch: an ownership check is deleted", "sub": "fixture OW-03 · paper §2", "patch": ["-  if (!acl_check(user_id, doc_id)) {", "-      return NULL;", "-  }", "   return db_fetch_doc(doc_id);"], "steps": [{"q": "Before the patch: what governs the fetch?", "cmd": "duc-proto normalize broken_access_control_safe.ll | grep 'db_fetch_doc'", "out": ["  def %doc                   <- call(@db_fetch_doc, %doc_id)    @ %is_ok"]}, {"q": "What can an input reach now, unguarded, that it couldn't before?", "cmd": "duc-proto diff broken_access_control_safe.ll broken_access_control.ll", "out": ["@get_document:", "  NEW capability paths (introduced in after):", "    + %doc_id -> %doc", "        %doc_id --[true]--> %doc", "    + %doc_id -> ret", "        %doc_id --[true]--> %doc --[true]--> ret"]}]}, {"title": "2 · Heartbeat: a length check is deleted", "sub": "fixture DC-03 · model of CVE-2014-0160 (the IR model performs the copy with write)", "patch": ["   uint16_t payload_len = my_ntohs(req);", "-  if (req_len < 2 || (size_t)payload_len > req_len - 2)", "-      return;", "   memcpy(resp, req + 2, payload_len);"], "steps": [{"q": "Before the patch: what governs the copy?", "cmd": "duc-proto normalize heartbleed_toy_safe.ll | grep 'call\\(@write'", "out": ["  def %sent                  <- call(@write, const:1, %payload_len, %req_data)  @ %too_big"]}, {"q": "What can the request reach now, unguarded?", "cmd": "duc-proto diff heartbleed_toy_safe.ll heartbleed_toy.ll", "out": ["@heartbeat_reply:", "  NEW capability paths (introduced in after):", "    + %req -> %req_data", "        %req --[true]--> %req_data", "    + %req -> %sent", "        %req --[true]--> %req_data --[true]--> %sent", "        %req --[true]--> %pl_ptr --[true]--> %payload_len_raw --[true]--> %payload_len --[true]--> %sent", "    + %req -> ret", "        %req --[true]--> %req_data --[true]--> %sent --[true]--> ret", "        %req --[true]--> %pl_ptr --[true]--> %payload_len_raw --[true]--> %payload_len --[true]--> %sent --[true]--> ret"]}]}, {"title": "3 · Ping endpoint: hostname validation is deleted", "sub": "fixture OW-02 · command injection", "patch": ["-  int ok = validate_hostname(host);", "-  if (!ok) return -1;", "   const char *cmd = build_ping_cmd(host);", "   return system(cmd);"], "steps": [{"q": "Before the patch: what governs the shell command?", "cmd": "duc-proto normalize cmd_injection_safe.ll | grep 'build_ping_cmd|@system'", "out": ["  def %cmd                   <- call(@build_ping_cmd, %host)    @ %is_bad", "  def %ret                   <- call(@system, %cmd)             @ %is_bad"]}, {"q": "What can the hostname reach now, unguarded?", "cmd": "duc-proto diff cmd_injection_safe.ll cmd_injection.ll", "out": ["@run_ping:", "  NEW capability paths (introduced in after):", "    + %host -> %cmd", "        %host --[true]--> %cmd", "    + %host -> %ret", "        %host --[true]--> %cmd --[true]--> %ret", "    + %host -> ret", "        %host --[true]--> %cmd --[true]--> %ret --[true]--> ret"]}]}, {"title": "4 · Integer dispatch: the range check goes, and the integer becomes a pointer", "sub": "fixture DC-02 · paper §6.1", "patch": ["-  if (user_val < 0 || user_val > 255)", "-      return -1;", "-  return write(1, safe_buf, (size_t)user_val);", "+  volatile int *dangerous_ptr = (volatile int *)(long)user_val;", "+  int leaked = *dangerous_ptr;", "+  return write(1, safe_buf, (size_t)user_val + leaked);"], "steps": [{"q": "Before the patch: what governs the write?", "cmd": "duc-proto normalize before.ll | grep 'call\\(@write'", "out": ["  def %result                <- call(@write, const:1, %safe_buf, %uval)  @ %cmp_hi"]}, {"q": "What can the integer reach now, unguarded?", "cmd": "duc-proto diff before.ll after.ll", "out": ["@safe_dispatch:", "  NEW capability paths (introduced in after):", "    + %safe_buf -> %result", "        %safe_buf --[true]--> %result", "    + %safe_buf -> ret", "        %safe_buf --[true]--> %result --[true]--> ret", "    + %user_val -> %danger_ptr", "        %user_val --[true]--> %uval64 --[true]--> %danger_ptr", "    + %user_val -> %leaked", "        %user_val --[true]--> %uval64 --[true]--> %danger_ptr --[true]--> %leaked", "    + %user_val -> %result", "        %user_val --[true]--> %write_size --[true]--> %write_size64 --[true]--> %result", "        %user_val --[true]--> %uval64 --[true]--> %danger_ptr --[true]--> %leaked --[true]--> %write_size --[true]--> %write_size64 --[true]--> %result", "    + %user_val -> %uval64", "        %user_val --[true]--> %uval64", "    + %user_val -> %write_size", "        %user_val --[true]--> %write_size", "        %user_val --[true]--> %uval64 --[true]--> %danger_ptr --[true]--> %leaked --[true]--> %write_size", "    + %user_val -> %write_size64", "        %user_val --[true]--> %write_size --[true]--> %write_size64", "        %user_val --[true]--> %uval64 --[true]--> %danger_ptr --[true]--> %leaked --[true]--> %write_size --[true]--> %write_size64", "    + %user_val -> ret", "        %user_val --[true]--> %write_size --[true]--> %write_size64 --[true]--> %result --[true]--> ret", "        %user_val --[true]--> %uval64 --[true]--> %danger_ptr --[true]--> %leaked --[true]--> %write_size --[true]--> %write_size64 --[true]--> %result --[true]--> ret"]}]}];
const term = document.getElementById("term");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function colour(line) {
  let h = esc(line);
  if (/^-/.test(line)) return `<span class="del">${h}</span>`;
  if (/^\+/.test(line)) return `<span class="add">${h}</span>`;
  if (/^\s+\+ /.test(line)) return `<span class="new">${h}</span>`;
  h = h.replace(/--\[true\]--&gt;/g, '--<span class="tru">[true]</span>--&gt;');
  h = h.replace(/(@ %[A-Za-z_0-9]+)\s*$/, '<span class="guard">$1</span>');
  return h;
}
// build a flat list of frames per case: 0 = title+patch, then for each step: type command, then output
let ci = 0, fi = 0, busy = false;
function frames(c) { const f = [{k:"patch"}]; c.steps.forEach((s, j) => { f.push({k:"cmd", j}); f.push({k:"out", j}); }); return f; }
function render(upTo, animateLast) {
  const c = CASES[ci], f = frames(c); term.innerHTML = "";
  const add = html => { const d = document.createElement("div"); d.innerHTML = html; term.appendChild(d); return d; };
  for (let i = 0; i <= upTo; i++) {
    const fr = f[i];
    if (fr.k === "patch") { add(`<span class="title">${esc(c.title)}</span>`); add(`<span class="sub">${esc(c.sub)}</span>`); add(" "); c.patch.forEach(l => add(colour(l))); }
    if (fr.k === "cmd") {
      const s = c.steps[fr.j]; add(" "); add(`<span class="q">${esc(s.q)}</span>`);
      const line = add(`<span class="prompt">$ </span><span class="cmd"></span>`);
      const span = line.querySelector(".cmd");
      if (i === upTo && animateLast) { typeOut(span, s.cmd); } else span.textContent = s.cmd;
    }
    if (fr.k === "out") {
      const s = c.steps[fr.j];
      if (i === upTo && animateLast) { printOut(s.out, add); } else s.out.forEach(l => add(colour(l)));
    }
  }
  term.scrollTop = term.scrollHeight;
}
function typeOut(span, text) {
  busy = true; let k = 0; const cur = document.createElement("span"); cur.className = "cursor"; cur.textContent = " ";
  span.after(cur);
  const t = setInterval(() => { span.textContent = text.slice(0, ++k); term.scrollTop = term.scrollHeight;
    if (k >= text.length) { clearInterval(t); cur.remove(); busy = false; } }, 28);
}
function printOut(lines, add) {
  busy = true; let k = 0;
  const t = setInterval(() => { if (k < lines.length) { add(colour(lines[k++])); term.scrollTop = term.scrollHeight; }
    else { clearInterval(t); busy = false; } }, 70);
}
function next() {
  if (busy) return;
  const f = frames(CASES[ci]);
  if (fi < f.length - 1) { fi++; render(fi, true); }
  else if (ci < CASES.length - 1) { ci++; fi = 0; render(0, false); }
}
function back() { if (busy) return; if (fi > 0) { fi--; render(fi, false); } else if (ci > 0) { ci--; fi = frames(CASES[ci]).length - 1; render(fi, false); } }
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); back(); }
  else if (/^[1-4]$/.test(e.key)) { ci = +e.key - 1; fi = 0; render(0, false); }
});
term.addEventListener("click", next);
const h = new URLSearchParams(location.hash.slice(1)); if (h.get("case")) ci = Math.max(0, Math.min(3, +h.get("case") - 1));
if (h.get("step")) fi = Math.max(0, Math.min(frames(CASES[ci]).length - 1, +h.get("step")));
render(fi, false);
</script>
</body></html>
